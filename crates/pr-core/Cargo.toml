[package]
name = "pr-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Penguin Redis — pr-core: SafeText, ExecutionOutcome, CommandRequest, TaskScope"

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

# V-C07 / §35.1: the OS delivery layer for Ctrl+C and Ctrl+Break. The meaning layer above it
# is platform-free; only `SetConsoleCtrlHandler` is not.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
