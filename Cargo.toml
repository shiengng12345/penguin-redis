[workspace]
resolver = "3"
members = ["crates/*", "xtask", "xtask/resp-server", "xtask/pty-harness", "xtask/differential", "xtask/plugin-fixtures"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
# ADR-023. One place, deliberately: changing the project's licence should be one edit, not a
# hunt through twenty crates.
license = "MIT OR Apache-2.0"
repository = "https://github.com/shiengng12345/penguin-redis"

[workspace.dependencies]
# Pinned in Cargo.lock; versions fixed at first `cargo build` and reviewed under ADR-023 supply-chain notes.
bytes = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
proptest = "1"
insta = { version = "1", features = ["yaml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"   # Penguin-owned schemas ONLY (v2.1 §8.3); never for server business JSON
toml = "0.9"
blake3 = "1"
crossterm = "0.29"   # ADR-022: the single event source and raw-mode owner
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }  # §31.1 TUI layout
tracing = "0.1"
unicode-width = "0.2"
# V-G04 / ADR-032. rustls with an explicit CA set: there is no "accept anything" mode to
# accidentally reach for. `ring` rather than the default provider so no C toolchain is needed
# on any of the three CI runners.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
# PEM parsing comes from rustls-pki-types itself: `rustls-pemfile` is unmaintained
# (RUSTSEC-2025-0134) and its functionality moved here. Taking the maintained path is cheaper
# than carrying a deny.toml exception that outlives the reason for it.
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = "0.14"   # test fixtures only: certificates are generated, never committed (they expire)
# V-B01 / SPIKE-002 / ADR-031: an INTEROP TEST SUBJECT, never a product dependency.
# It appears only in dev-dependencies; `ci/check-redis-rs-is-dev-only.sh` keeps it that way.
redis = { version = "1", default-features = false, features = ["tokio-comp"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
