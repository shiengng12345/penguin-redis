name: Soak

# V-H05 / PERF-04 (v2.1 §32.1 Soak). Its own workflow for two reasons: it runs for hours, and
# `ci.yml` cancels superseded runs — which would kill this one the moment anybody pushed.
#
# §32.1 asks for eight hours. A GitHub-hosted runner kills any job at six, and a release build
# has to happen first, so this runs five and the full eight-hour evidence comes from a machine
# that can host it (`benches/soak/README.md` records it, with its JSONL). The analysis, its
# thresholds and its exit code are the same in both places — what differs is the length of the
# window, and that difference is written down rather than rounded off.
#
# `workflow_dispatch` takes a `smoke` input so the job itself can be checked in a few minutes.
# A five-hour job whose first run is also its first test is a five-hour way to find a typo —
# and a short run under the real criterion is a guaranteed red build, which is a notification
# about nothing. `--smoke` asks the smaller question out loud instead.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      smoke:
        description: "Check that the job's plumbing works (a few minutes). Says nothing about steadiness."
        type: boolean
        required: false
        default: false
      hours:
        description: "How long to soak. Ignored when smoke is set."
        required: false
        default: "5"

concurrency:
  group: soak
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  soak:
    name: soak (5h, inside the 6h a hosted runner allows)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: the growth detector's own tests
        # Run first. A soak whose analysis is broken is five hours spent producing a number
        # nobody can trust, and the failure would only show up at the end.
        run: cargo test -p soak --test growth
      - name: start Redis
        # The same digest the rest of the topology fixtures pin (redis 7.4.11).
        run: |
          docker run -d --name soak-redis -p 6379:6379 \
            redis@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
          for _ in $(seq 1 30); do
            docker exec soak-redis redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec soak-redis redis-cli ping | grep -q PONG
      - name: soak
        # Five hours, not five and a half. The job is capped at 350 minutes and a release build
        # of the workspace on a cold cache is not free; a soak that gets killed at the end
        # produces a JSONL nobody can draw a line through, which is worse than a shorter one.
        #
        # `smoke` runs for three minutes and asks the smaller question — does the job work —
        # because the growth analysis correctly refuses to call three minutes steady, and a
        # deliberate red build sends a notification about nothing.
        run: |
          if [ "${{ inputs.smoke }}" = "true" ]; then
            cargo run --release -p soak -- \
              --hours 0.05 --smoke --out soak-metrics.jsonl --redis 127.0.0.1:6379
          else
            cargo run --release -p soak -- \
              --hours "${{ inputs.hours || '5' }}" --out soak-metrics.jsonl --redis 127.0.0.1:6379
          fi
      - name: keep the samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-metrics
          path: soak-metrics.jsonl
      - name: stop Redis
        if: always()
        run: docker rm -f soak-redis || true
