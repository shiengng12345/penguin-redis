name: CI

# Phase 0 V-A05 — the multi-target matrix. Gates from v2.1 §34.2.
# Every server target is pinned by digest via compatibility/manifest.toml. `latest` is banned
# and enforced by the `manifest-pinned` job below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- Build / lint gate
  build-lint:
    name: build+lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (workspace lint level; warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --all-targets

  # ---------------------------------------------------------------- Correctness gate
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@nextest
      - name: unit + integration
        run: cargo nextest run --workspace --no-fail-fast
      - name: doc tests
        run: cargo test --workspace --doc

  # ---------------------------------------------------------------- Compatibility gate
  # A target may only be marked `verified` in the manifest once this job is green for it.
  server-matrix:
    name: ${{ matrix.family }} ${{ matrix.line }} / ${{ matrix.topology }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: redis
            line: "7.2"
            image: redis@sha256:74566c6910d13ae61e7ce73ebd3127438a1fe805b309b097c323142719ec8a5b
            topology: standalone
          - family: redis
            line: "7.4"
            image: redis@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
            topology: standalone
          - family: redis
            line: "8.0"
            image: redis@sha256:ae471bdc20de180beed36e347d170ec0bdf8faa327959ea1f24692f22b05b955
            topology: standalone
          - family: valkey
            line: "8.0"
            image: valkey/valkey@sha256:dbb2de90cb7a60c4f3f7e8d73fcaab69a94c557bb08a064108fa5d5b1814086e
            topology: standalone
          - family: valkey
            line: "8.1"
            image: valkey/valkey@sha256:3fbd2e3e4b6e85e046c1e7c215e8f79087bc0357789184305806664e320996f3
            topology: standalone
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@nextest
      - name: start server (pinned by digest)
        run: |
          docker run -d --name target -p 6379:6379 "${{ matrix.image }}"
          for i in $(seq 1 30); do
            if docker exec target redis-cli PING 2>/dev/null | grep -q PONG; then break; fi
            if docker exec target valkey-cli PING 2>/dev/null | grep -q PONG; then break; fi
            sleep 1
          done
      - name: integration tests against live server
        env:
          PENGUIN_TEST_REDIS: redis://127.0.0.1:6379
          PENGUIN_TEST_FAMILY: ${{ matrix.family }}
          PENGUIN_TEST_LINE: ${{ matrix.line }}
        run: cargo nextest run --workspace --no-fail-fast -E 'test(/live_/)' --no-tests=pass
      - name: server log on failure
        if: failure()
        run: docker logs target

  # ---------------------------------------------------------------- Cluster / Sentinel
  topology:
    name: redis 7.4 / ${{ matrix.topology }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topology: [cluster, sentinel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@nextest
      - name: bring up ${{ matrix.topology }}
        run: ./ci/topology/${{ matrix.topology }}-up.sh
      - name: topology tests
        env:
          PENGUIN_TEST_TOPOLOGY: ${{ matrix.topology }}
        run: cargo nextest run --workspace --no-fail-fast -E 'test(/topology_/)' --no-tests=pass
      - name: tear down
        if: always()
        run: ./ci/topology/${{ matrix.topology }}-down.sh || true

  # ---------------------------------------------------------------- Safety gate
  safety:
    name: safety (secrets, injection, supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny (licences, advisories, bans, sources)
        run: cargo deny check
      # ADR-031: redis-rs is an interop test subject. A decision that only lives in a document
      # drifts; this resolves the real link graph, so an accidental promotion to a product
      # dependency fails here rather than in a release.
      - name: redis-rs stays a dev-dependency (ADR-031)
        run: ./ci/check-redis-rs-is-dev-only.sh
      - name: security test suite
        run: cargo nextest run --workspace --no-fail-fast -E 'test(/security_|secret_|injection_|approval_/)' --no-tests=pass

  # ---------------------------------------------------------------- Manifest gate
  manifest-pinned:
    name: compatibility manifest is digest-pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no floating tags
        run: |
          # Strip comments first: the file explains that `latest` is banned, and that
          # explanation must not be mistaken for a use of it.
          if sed 's/#.*//' compatibility/manifest.toml | grep -nE '(^|[^a-z])latest'; then
            echo "::error::compatibility/manifest.toml must not reference 'latest' (v2.1 §20.4)"
            exit 1
          fi
          missing=$(grep -c '^digest = "sha256:' compatibility/manifest.toml || true)
          servers=$(grep -c '^\[\[server\]\]' compatibility/manifest.toml || true)
          set -e
          echo "servers=$servers digests=$missing"
          if [ "$missing" -lt "$servers" ]; then
            echo "::error::every [[server]] needs a sha256 digest"
            exit 1
          fi
      - name: no target may claim `verified` without a green matrix job
        run: ./ci/check-verified-claims.sh

  # ---------------------------------------------------------------- Fixtures gate
  fixtures:
    name: protocol fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@nextest
      - name: regenerate and diff
        run: |
          cargo run -q -p resp-server -- gen-fixtures /tmp/fx
          diff -r fixtures/protocol /tmp/fx \
            || { echo "::error::fixtures/protocol is stale; re-run: cargo run -p resp-server -- gen-fixtures fixtures/protocol"; exit 1; }
      - name: every category has at least 20 samples (V-A03 criterion)
        run: cargo nextest run -p resp-server -E 'test(/every_category/)'

  # ---------------------------------------------------------------- Catalog gate
  catalog:
    name: catalog snapshots reproduce from their pinned images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: fingerprints match, and each snapshot re-captures byte-identically
        run: ./ci/check-catalog-snapshots.sh
      - name: the compiled catalog classifies every command
        run: cargo test -p pr-catalog --test grammar_table

  # ---------------------------------------------------------------- Phase 0 gate
  phase-0-gate:
    name: Phase 0 report has no unresolved items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no DEFERRED or SKIPPED states
        run: ./ci/check-phase0-report.sh
