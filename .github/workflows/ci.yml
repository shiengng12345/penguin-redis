name: CI

# Phase 0 V-A05 — the multi-target matrix. Gates from v2.1 §34.2.
# Every server target is pinned by digest via compatibility/manifest.toml. `latest` is banned
# and enforced by the `manifest-pinned` job below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A superseded run is verifying a commit nobody is on any more, and while it
# queues, the run that matters waits behind it -- five runs deep at one point, which is how a
# fix takes an hour to be seen. The Phase 0 exit gate reads the latest run on `main`, so that
# is the one worth the runners.
#
# The soak lives in its own workflow (`soak.yml`) precisely so this cannot cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- Build / lint gate
  build-lint:
    name: build+lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (workspace lint level; warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --all-targets

  # ---------------------------------------------------------------- Correctness gate
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@nextest
      - name: unit + integration
        run: cargo nextest run --workspace --no-fail-fast
      - name: doc tests
        run: cargo test --workspace --doc

  # ---------------------------------------------------------------- Compatibility gate
  # A target may only be marked `verified` in the manifest once this job is green for it.
  server-matrix:
    name: ${{ matrix.family }} ${{ matrix.line }} / ${{ matrix.topology }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: redis
            line: "7.2"
            image: redis@sha256:74566c6910d13ae61e7ce73ebd3127438a1fe805b309b097c323142719ec8a5b
            topology: standalone
          - family: redis
            line: "7.4"
            image: redis@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
            topology: standalone
          - family: redis
            line: "8.0"
            image: redis@sha256:ae471bdc20de180beed36e347d170ec0bdf8faa327959ea1f24692f22b05b955
            topology: standalone
          - family: valkey
            line: "8.0"
            image: valkey/valkey@sha256:dbb2de90cb7a60c4f3f7e8d73fcaab69a94c557bb08a064108fa5d5b1814086e
            topology: standalone
          - family: valkey
            line: "8.1"
            image: valkey/valkey@sha256:3fbd2e3e4b6e85e046c1e7c215e8f79087bc0357789184305806664e320996f3
            topology: standalone
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@nextest
      - name: start server (pinned by digest)
        run: |
          docker run -d --name target -p 6379:6379 "${{ matrix.image }}"
          for i in $(seq 1 30); do
            if docker exec target redis-cli PING 2>/dev/null | grep -q PONG; then break; fi
            if docker exec target valkey-cli PING 2>/dev/null | grep -q PONG; then break; fi
            sleep 1
          done
      # No `--no-tests=pass`. Until `crates/pr-transport/tests/live_matrix.rs` existed, this
      # filter matched nothing and that flag turned "nothing ran" into a pass: seven targets,
      # seven green badges, seven containers started and thrown away. An empty selection here
      # means the matrix has stopped testing the thing it exists for, and must be a failure.
      - name: integration tests against live server
        env:
          PENGUIN_TEST_REDIS: redis://127.0.0.1:6379
          PENGUIN_TEST_FAMILY: ${{ matrix.family }}
          PENGUIN_TEST_LINE: ${{ matrix.line }}
        run: cargo nextest run --workspace --no-fail-fast -E 'test(/live_/)'
      - name: server log on failure
        if: failure()
        run: docker logs target

  # ---------------------------------------------------------------- Cluster / Sentinel
  topology:
    name: redis 7.4 / ${{ matrix.topology }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topology: [cluster, sentinel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@nextest
      - name: bring up ${{ matrix.topology }}
        run: ./ci/topology/${{ matrix.topology }}-up.sh
      - name: topology tests
        env:
          PENGUIN_TEST_TOPOLOGY: ${{ matrix.topology }}
        # No `--no-tests=pass` here either: this filter matches eight tests today, and the
        # flag's only remaining effect would be to turn their deletion into a pass.
        run: cargo nextest run --workspace --no-fail-fast -E 'test(/topology_/)'
      - name: tear down
        if: always()
        run: ./ci/topology/${{ matrix.topology }}-down.sh || true

  # ---------------------------------------------------------------- Shared files (V-G05)
  shared-files:
    name: config locking + credential store (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config gnome-keyring dbus-x11
      # LIFE-03's no-lost-updates case spawns real processes, and WIN-03's ACL check is
      # meaningless anywhere but Windows. Both run on all three so the platform-specific half
      # is exercised where it matters rather than only where it was written.
      - name: advisory lock, atomic replace, per-user permissions
        run: cargo test -p pr-profiles --test shared_files -- --nocapture
      # The credential store tests touch the real OS store, so they are #[ignore]d for a
      # developer on a headless box and run explicitly here. On Linux that needs a session
      # keyring; without one the test would be reporting the environment, not the code.
      - name: credential store round trip (non-Linux)
        if: runner.os != 'Linux'
        run: ./ci/run-ignored.sh -p pr-profiles --test credential_store -- --nocapture
      - name: credential store round trip (Linux, with a session keyring)
        if: runner.os == 'Linux'
        run: |
          export $(dbus-launch)
          echo -n "ci" | gnome-keyring-daemon --unlock --replace --daemonize > /dev/null 2>&1 || true
          ./ci/run-ignored.sh -p pr-profiles --test credential_store -- --nocapture

  # ---------------------------------------------------------------- SSH tunnels (V-G03)
  ssh-tunnels:
    name: SSH per-node and SOCKS5 against a real jump host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: bring up the bastion and the cluster behind it
        run: bash ci/topology/ssh/up.sh
      # Both §21.5 modes follow MOVED through a real sshd, host key checking refuses an
      # unknown key, and the tunnel is proved load-bearing by stopping the bastion.
      - name: both modes, end to end
        run: ./ci/run-ignored.sh -p pr-transport --test ssh_live -- --test-threads=1 --nocapture
      - name: bastion log on failure
        if: failure()
        run: docker logs pr-ssh-bastion || true
      - name: tear down
        if: always()
        run: bash ci/topology/ssh/down.sh

  # ---------------------------------------------------------------- Safety gate
  safety:
    name: safety (secrets, injection, supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny (licences, advisories, bans, sources)
        run: cargo deny check
      # ADR-031: redis-rs is an interop test subject. A decision that only lives in a document
      # drifts; this resolves the real link graph, so an accidental promotion to a product
      # dependency fails here rather than in a release.
      - name: redis-rs stays a dev-dependency (ADR-031)
        run: ./ci/check-redis-rs-is-dev-only.sh
      # Named test targets, not a name filter. The filter this replaces --
      # `test(/security_|secret_|injection_|approval_/)` with `--no-tests=pass` -- matched
      # exactly one test in the whole workspace, and it was a parser test for the shape of a
      # secret reference. Every actual security suite is in a file whose *functions* are named
      # after what they assert, which is right, and which made the filter select almost nothing
      # while the job stayed green and said "safety".
      #
      # A missing target is an error here, so a suite that gets renamed or deleted fails the
      # job instead of quietly leaving it.
      - name: security test suites
        run: |
          cargo test -p pr-security --test approval --test trust_binding --test threat_model
          cargo test -p pr-render --test safetext_boundary
          cargo test -p pr-mcp --test approval_boundary
          cargo test -p prc --test secret_paths

  # ---------------------------------------------------------------- Differential gate
  differential:
    name: differential (prc vs pinned redis-cli, four layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # The live half is `#[ignore]` because it needs Docker. That is exactly the shape that
      # let V-C07's Windows PTY tests never run, so it is given its own job and run
      # explicitly, rather than left to a flag someone might drop.
      - name: two servers, five cases, four layers
        run: ./ci/run-ignored.sh -p differential -- --test-threads=1
      - name: the committed report still reproduces
        run: ./ci/check-differential.sh
      - name: report on failure
        if: failure()
        run: cat tests/differential/report/*.json || true

  # ---------------------------------------------------------------- Discovery (V-F07)
  discovery:
    name: explicit discovery on a million keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # The pure half runs in the ordinary test job. This one adds a real server with 10^6
      # keys and a real ACL refusal, which is what ADR-033's numbers were measured against.
      - name: 10^6 keys, two match modes, a real NOPERM
        run: ./ci/run-ignored.sh -p pr-intelligence --test discovery_live -- --nocapture --test-threads=1

  # ---------------------------------------------------------------- Large values (V-H02)
  large-values:
    name: 1 GiB synthetic blob + real 512 MB Redis string
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # The synthetic 1 GiB case runs in the ordinary test job too. This one adds the real
      # server at its stock 512 MB limit, which needs Docker and half a gigabyte.
      - name: real Redis at its documented string limit
        run: ./ci/run-ignored.sh -p pr-protocol --test large_values -- --nocapture

  # ---------------------------------------------------------------- Manifest gate
  manifest-pinned:
    name: compatibility manifest is digest-pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no floating tags
        run: |
          # Strip comments first: the file explains that `latest` is banned, and that
          # explanation must not be mistaken for a use of it.
          if sed 's/#.*//' compatibility/manifest.toml | grep -nE '(^|[^a-z])latest'; then
            echo "::error::compatibility/manifest.toml must not reference 'latest' (v2.1 §20.4)"
            exit 1
          fi
          missing=$(grep -c '^digest = "sha256:' compatibility/manifest.toml || true)
          servers=$(grep -c '^\[\[server\]\]' compatibility/manifest.toml || true)
          set -e
          echo "servers=$servers digests=$missing"
          if [ "$missing" -lt "$servers" ]; then
            echo "::error::every [[server]] needs a sha256 digest"
            exit 1
          fi
      - name: no target may claim `verified` without a green matrix job
        run: ./ci/check-verified-claims.sh

  # ---------------------------------------------------------------- Fixtures gate
  fixtures:
    name: protocol fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@nextest
      - name: regenerate and diff
        run: |
          cargo run -q -p resp-server -- gen-fixtures /tmp/fx
          diff -r fixtures/protocol /tmp/fx \
            || { echo "::error::fixtures/protocol is stale; re-run: cargo run -p resp-server -- gen-fixtures fixtures/protocol"; exit 1; }
      - name: every category has at least 20 samples (V-A03 criterion)
        run: cargo nextest run -p resp-server -E 'test(/every_category/)'

  # ---------------------------------------------------------------- Catalog gate
  catalog:
    name: catalog snapshots reproduce from their pinned images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libdbus-1-dev is what `keyring`'s secret-service backend links against (ADR-014).
        # The runner image stopped shipping it, and a missing system library is not something
        # to discover per-job: every job that compiles the workspace installs it.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: fingerprints match, and each snapshot re-captures byte-identically
        run: ./ci/check-catalog-snapshots.sh
      - name: the compiled catalog classifies every command
        run: cargo test -p pr-catalog --test grammar_table

  # ---------------------------------------------------------------- Phase 0 gate
  phase-0-gate:
    name: Phase 0 report has no unresolved items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no DEFERRED or SKIPPED states
        run: ./ci/check-phase0-report.sh
      # V-J01 / V-J04: every ADR accepted, every ADR carrying a recorded result, every spike
      # naming one. An ADR with an empty result section is a decision with no evidence that it
      # survived contact with the code.
      - name: ADR ledger is complete
        run: ./ci/check-adr-ledger.sh
      # An #[ignore]d test that no job runs is indistinguishable from dead code. This found a
      # reason string naming a `credentials` job that has never existed.
      - name: every ignored test names a CI job that exists
        run: ./ci/check-ignored-tests-have-a-job.sh
      # A criterion named only in the plan is a criterion nobody wrote a test for, and the V
      # item still goes green on the tests that were written.
      - name: every acceptance case the plan names is claimed somewhere
        run: ./ci/check-plan-cases-are-claimed.sh
      # The 产出 column is what a reviewer follows to find the evidence. 39 of its 70 paths
      # pointed at directories that were never created.
      - name: every promised output path exists or is mapped
        run: ./ci/check-plan-outputs.sh
      # V-F08 / ADR-034: §16.4's held-out gate turns itself on when an independently written
      # corpus appears. Printed here so the waiting state is visible in every run rather than
      # only in a document.
      - name: purpose-search gates
        run: cargo test -p pr-intelligence --test find_recall -- --nocapture
