# V-F08 canonical phrasings — sorted-set group.
#
# Hand-written, one command at a time: how a person actually asks for this thing.
# §16.4 requires at least three per command, in Chinese and English, and this corpus
# is ALSO what the synonym vocabulary was built from -- which is why its recall number
# only proves the vocabulary is complete. See ../heldout/ for the measurement that
# means something.

[[case]]
command = "BZMPOP"
phrases = [
  "阻塞地从多个有序集合弹出",
  "block and pop from several sorted sets",
  "盯着几个排行榜等元素出现",
]

[[case]]
command = "BZPOPMAX"
phrases = [
  "阻塞等待弹出分数最高的",
  "block until a highest-score member can be popped",
  "等着取分数最高的那个",
]

[[case]]
command = "BZPOPMIN"
phrases = [
  "阻塞等待弹出分数最低的",
  "block until a lowest-score member can be popped",
  "没有就等着，有了取最小分",
]

[[case]]
command = "ZADD"
phrases = [
  "往有序集合里加带分数的成员",
  "add a member with a score to a sorted set",
  "给排行榜加一条带分数的记录",
]

