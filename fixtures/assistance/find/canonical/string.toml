# V-F08 canonical phrasings — string group.
#
# Hand-written, one command at a time: how a person actually asks for this thing.
# §16.4 requires at least three per command, in Chinese and English, and this corpus
# is ALSO what the synonym vocabulary was built from -- which is why its recall number
# only proves the vocabulary is complete. See ../heldout/ for the measurement that
# means something.

[[case]]
command = "APPEND"
phrases = [
  "在字符串末尾追加内容",
  "append text to the end of a string",
  "往已有的值后面接一段",
]

[[case]]
command = "DECR"
phrases = [
  "把计数器减一",
  "decrement a counter by one",
  "让这个数字自减",
]

[[case]]
command = "DECRBY"
phrases = [
  "给计数器减去指定的数",
  "decrement a number by a given amount",
  "数值减掉某个量",
]

[[case]]
command = "GET"
phrases = [
  "读取一个 key 的字符串值",
  "read the string value of a key",
  "取出某个 key 存的内容",
]

[[case]]
command = "GETDEL"
phrases = [
  "取出值的同时把 key 删掉",
  "read a value and delete the key atomically",
  "读完就删，一步完成",
]

[[case]]
command = "GETEX"
phrases = [
  "读取值并顺便改过期时间",
  "read a value and set its expiry at the same time",
  "取值的同时续期",
]

[[case]]
command = "GETRANGE"
phrases = [
  "按下标取字符串的一段",
  "read a byte range out of a string",
  "从第几个字符取到第几个",
]

[[case]]
command = "GETSET"
phrases = [
  "取旧值并写入新值",
  "replace a value and return the old one",
  "换成新值但要拿回原来的",
]

[[case]]
command = "INCR"
phrases = [
  "把计数器加一",
  "increment a counter by one",
  "让这个数字自增",
]

[[case]]
command = "INCRBY"
phrases = [
  "给计数器加上指定的数",
  "increment a number by a given amount",
  "数值加上某个增量",
]

[[case]]
command = "INCRBYFLOAT"
phrases = [
  "给数值加上一个小数",
  "increment a number by a floating point amount",
  "按浮点数增加余额",
]

[[case]]
command = "LCS"
phrases = [
  "比较两个字符串的最长公共子串",
  "longest common subsequence of two strings",
  "找出两段文本相同的部分",
]

[[case]]
command = "MGET"
phrases = [
  "一次读多个 key 的值",
  "read several keys in one request",
  "批量取多个 key 的内容",
]

[[case]]
command = "MSET"
phrases = [
  "一次写入多个 key",
  "set several keys in one request",
  "批量设置多个键值对",
]

[[case]]
command = "MSETNX"
phrases = [
  "批量写入但只在全都不存在时",
  "set several keys only if none of them exist",
  "多个 key 一起写，有一个存在就整体放弃",
]

[[case]]
command = "PSETEX"
phrases = [
  "写入字符串并按毫秒设置过期",
  "set a string with a millisecond expiry",
  "以毫秒为单位设置带过期的值",
]

[[case]]
command = "SET"
phrases = [
  "设置一个 key 的字符串值",
  "store a string value under a key",
  "把某个 key 写成指定内容",
]

[[case]]
command = "SETEX"
phrases = [
  "写入一个带过期时间的字符串",
  "set a string with an expiry in seconds",
  "设置值并同时指定几秒后过期",
]

[[case]]
command = "SETNX"
phrases = [
  "只在 key 不存在时才写入",
  "set a key only if it does not already exist",
  "不存在才设置，存在就别动",
]

[[case]]
command = "SETRANGE"
phrases = [
  "从指定位置改写字符串的一段",
  "overwrite part of a string at an offset",
  "在某个偏移量上覆盖一段内容",
]

[[case]]
command = "STRLEN"
phrases = [
  "查一个字符串有多长",
  "length of a string value",
  "这个 key 的值有多少字节",
]

[[case]]
command = "SUBSTR"
phrases = [
  "取字符串的一段",
  "read part of a string by offset",
  "截取值的某个片段",
]
