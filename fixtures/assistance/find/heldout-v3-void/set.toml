# V-F08 held-out v3 — VOID — set group.
#
# This corpus measured 42.9% top-3 against the vocabulary as it stood, and was then
# used to extend that vocabulary. §16.4: 「未达标 → 扩词表后 held-out 集换新（旧集作废，
# 防止泄漏）」. It is void as a measurement and kept here so the extension can be
# audited: deleting it would leave the vocabulary looking as though it had always
# known these words.
#
# It is NOT part of the canonical corpus either. Canonical is the 规范 register, and
# folding another register into it would change what the 95% gate measures.

[[case]]
command = "SADD"
phrases = [
  "把一个成员放进去，重复的不算",
  "put a member in, duplicates should not count",
]

[[case]]
command = "SCARD"
phrases = [
  "里面有多少个成员",
  "how many members are inside",
]

[[case]]
command = "SDIFF"
phrases = [
  "只在第一个里面有的那些",
  "the ones that only the first has",
]

[[case]]
command = "SDIFFSTORE"
phrases = [
  "算出来之后要留一份",
  "work that out and keep a copy",
]

[[case]]
command = "SINTER"
phrases = [
  "每个里面都有的那些",
  "the ones that every one of them has",
]

[[case]]
command = "SINTERCARD"
phrases = [
  "只关心重合了多少个",
  "I only care how many are common",
]

[[case]]
command = "SINTERSTORE"
phrases = [
  "算出交集之后要留一份",
  "work out the common ones and keep a copy",
]

[[case]]
command = "SISMEMBER"
phrases = [
  "只想确认某个成员在不在里面",
  "just confirm whether a member is inside",
]

[[case]]
command = "SMEMBERS"
phrases = [
  "把里面的成员全列出来",
  "list everything inside",
]

[[case]]
command = "SMISMEMBER"
phrases = [
  "一次确认好几个成员在不在",
  "confirm several members at once",
]

[[case]]
command = "SMOVE"
phrases = [
  "原子地从一个搬到另一个",
  "move it across without it being in neither",
]

[[case]]
command = "SPOP"
phrases = [
  "随机拿走一个并且不还回去",
  "take one at random and do not put it back",
]

[[case]]
command = "SRANDMEMBER"
phrases = [
  "随机看一个但要留在里面",
  "look at one at random but leave it inside",
]

[[case]]
command = "SREM"
phrases = [
  "把一个成员移出去",
  "take a member back out",
]

[[case]]
command = "SSCAN"
phrases = [
  "里面太多不敢一次全列",
  "there are too many to list in one go",
]

[[case]]
command = "SUNION"
phrases = [
  "把几个里面的合起来看",
  "see everything from several of them at once",
]

[[case]]
command = "SUNIONSTORE"
phrases = [
  "合起来之后要留一份",
  "combine them and keep a copy",
]
