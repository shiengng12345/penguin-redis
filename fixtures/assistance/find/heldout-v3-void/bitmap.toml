# V-F08 held-out v3 — VOID — bitmap group.
#
# This corpus measured 42.9% top-3 against the vocabulary as it stood, and was then
# used to extend that vocabulary. §16.4: 「未达标 → 扩词表后 held-out 集换新（旧集作废，
# 防止泄漏）」. It is void as a measurement and kept here so the extension can be
# audited: deleting it would leave the vocabulary looking as though it had always
# known these words.
#
# It is NOT part of the canonical corpus either. Canonical is the 规范 register, and
# folding another register into it would change what the 95% gate measures.

[[case]]
command = "BITCOUNT"
phrases = [
  "想数一共标记了多少个",
  "count how many positions are marked",
]

[[case]]
command = "BITFIELD"
phrases = [
  "想在一个值里塞几个小数字",
  "pack a few small numbers inside one value",
]

[[case]]
command = "BITFIELD_RO"
phrases = [
  "想读出塞好的小数字且不写",
  "read those packed numbers without writing",
]

[[case]]
command = "BITOP"
phrases = [
  "想把两组标记按位合起来",
  "combine two sets of marks bit by bit",
]

[[case]]
command = "BITPOS"
phrases = [
  "想找第一个被标记的位置",
  "find the first marked position",
]

[[case]]
command = "GETBIT"
phrases = [
  "想看某个位置有没有被标记",
  "check whether one position is marked",
]

[[case]]
command = "SETBIT"
phrases = [
  "想按位置打一个标记",
  "I want to mark one position",
]
