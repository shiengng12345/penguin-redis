# V-F08 held-out v3 — VOID — list group.
#
# This corpus measured 42.9% top-3 against the vocabulary as it stood, and was then
# used to extend that vocabulary. §16.4: 「未达标 → 扩词表后 held-out 集换新（旧集作废，
# 防止泄漏）」. It is void as a measurement and kept here so the extension can be
# audited: deleting it would leave the vocabulary looking as though it had always
# known these words.
#
# It is NOT part of the canonical corpus either. Canonical is the 规范 register, and
# folding another register into it would change what the 95% gate measures.

[[case]]
command = "BLMOVE"
phrases = [
  "没有就等，有了再原子地挪过去",
  "wait, then move it across without losing it",
]

[[case]]
command = "BLMPOP"
phrases = [
  "同时守着好几个队列等",
  "keep an eye on several queues and wait",
]

[[case]]
command = "BLPOP"
phrases = [
  "没有就一直等，有了就从前面拿",
  "if there is nothing, wait; then take from the front",
]

[[case]]
command = "BRPOP"
phrases = [
  "没有就一直等，有了就从后面拿",
  "if there is nothing, wait; then take from the back",
]

[[case]]
command = "BRPOPLPUSH"
phrases = [
  "老代码里那个会阻塞的防丢做法",
  "the legacy blocking trick for not losing a task",
]

[[case]]
command = "LINDEX"
phrases = [
  "想知道排在某个位置的是谁",
  "who is sitting at a particular spot",
]

[[case]]
command = "LINSERT"
