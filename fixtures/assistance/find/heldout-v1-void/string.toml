# V-F08 held-out v1 — VOID — string group.
#
# This corpus measured 22.7% top-3 against the vocabulary as it stood, and was then
# used to extend that vocabulary. §16.4: 「未达标 → 扩词表后 held-out 集换新（旧集作废，
# 防止泄漏）」. It is void as a measurement and kept here so the extension can be
# audited: deleting it would leave the vocabulary looking as though it had always
# known these words.
#
# It is NOT part of the canonical corpus either. Canonical is the 规范 register, and
# folding another register into it would change what the 95% gate measures.

[[case]]
command = "APPEND"
phrases = [
  "往日志字符串后面再加一行",
  "tack more text onto the end",
]

[[case]]
command = "DECR"
phrases = [
  "库存减一",
  "take one off the stock count",
]

[[case]]
command = "DECRBY"
phrases = [
  "库存一次扣 5",
  "take five off the count",
]

[[case]]
command = "GET"
phrases = [
  "我想看看这个 key 里面是什么",
  "what is in this key",
]

[[case]]
command = "GETDEL"
phrases = [
  "一次性令牌，用过就作废",
  "one-shot token, consume it on read",
]

[[case]]
command = "GETEX"
phrases = [
  "看一眼顺便把超时往后推",
  "look at it and refresh how long it lives",
]

[[case]]
command = "GETRANGE"
phrases = [
  "按字节位置切一段出来",
  "slice out bytes from position a to b",
]

[[case]]
command = "GETSET"
phrases = [
  "原子地换一个值并拿到旧的",
  "swap in a new value and get the previous one back",
]

[[case]]
command = "INCR"
phrases = [
  "做一个访问次数统计",
  "count page views",
]

[[case]]
command = "INCRBY"
phrases = [
  "一次加 10",
  "bump the counter by ten",
]

[[case]]
command = "INCRBYFLOAT"
phrases = [
  "账户余额加 12.5",
  "add a decimal amount to a balance",
]

[[case]]
command = "LCS"
phrases = [
  "看看两个版本的文本差在哪",
  "how similar are these two strings",
]

[[case]]
command = "MGET"
phrases = [
