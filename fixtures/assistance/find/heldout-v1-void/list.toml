# V-F08 held-out v1 — VOID — list group.
#
# This corpus measured 22.7% top-3 against the vocabulary as it stood, and was then
# used to extend that vocabulary. §16.4: 「未达标 → 扩词表后 held-out 集换新（旧集作废，
# 防止泄漏）」. It is void as a measurement and kept here so the extension can be
# audited: deleting it would leave the vocabulary looking as though it had always
# known these words.
#
# It is NOT part of the canonical corpus either. Canonical is the 规范 register, and
# folding another register into it would change what the 95% gate measures.

[[case]]
command = "BLMOVE"
phrases = [
  "等着把任务挪到处理中",
  "wait, then move a job to the working list",
]

[[case]]
command = "BLMPOP"
phrases = [
  "同时守着几个队列等活干",
  "wait across a few queues for whichever fires first",
]

[[case]]
command = "BLPOP"
phrases = [
  "没任务就挂着等，有了立刻做",
  "worker waits until a job shows up",
]

[[case]]
command = "BRPOP"
phrases = [
  "从后面等任务",
  "wait for a job at the back of the queue",
]

[[case]]
command = "BRPOPLPUSH"
phrases = [
  "阻塞版的可靠队列",
  "blocking reliable queue handoff",
]

[[case]]
command = "LINDEX"
phrases = [
