# V-F08 held-out v1 — VOID — geo group.
#
# This corpus measured 22.7% top-3 against the vocabulary as it stood, and was then
# used to extend that vocabulary. §16.4: 「未达标 → 扩词表后 held-out 集换新（旧集作废，
# 防止泄漏）」. It is void as a measurement and kept here so the extension can be
# audited: deleting it would leave the vocabulary looking as though it had always
# known these words.
#
# It is NOT part of the canonical corpus either. Canonical is the 规范 register, and
# folding another register into it would change what the 95% gate measures.

[[case]]
command = "GEOADD"
phrases = [
  "把门店位置记下来",
  "record where a shop is",
]

[[case]]
command = "GEODIST"
phrases = [
  "用户离这家店多远",
  "how far is one place from another",
]

[[case]]
command = "GEOHASH"
phrases = [
  "把位置变成一个短码",
  "turn a position into a short code",
]

[[case]]
command = "GEOPOS"
phrases = [
  "这家店在什么位置",
  "where exactly is this one",
]

[[case]]
command = "GEORADIUS"
phrases = [
  "老的按半径查附近",
  "the old way of finding things nearby",
]

[[case]]
command = "GEORADIUSBYMEMBER"
phrases = [
  "以这家店为中心找别的店",
  "find things near an existing entry",
]

[[case]]
command = "GEORADIUSBYMEMBER_RO"
phrases = [
  "以某店为中心找且不写",
  "nearby an existing entry, read only",
]

[[case]]
command = "GEORADIUS_RO"
phrases = [
  "老接口但保证不写",
  "the old nearby search, read only",
]

[[case]]
command = "GEOSEARCH"
phrases = [
  "找我附近三公里的店",
  "find shops near me",
]

[[case]]
command = "GEOSEARCHSTORE"
phrases = [
  "附近的店查出来存一份",
  "keep the nearby results somewhere",
]
