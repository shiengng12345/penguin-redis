# V-F08 held-out v1 — VOID — hash group.
#
# This corpus measured 22.7% top-3 against the vocabulary as it stood, and was then
# used to extend that vocabulary. §16.4: 「未达标 → 扩词表后 held-out 集换新（旧集作废，
# 防止泄漏）」. It is void as a measurement and kept here so the extension can be
# audited: deleting it would leave the vocabulary looking as though it had always
# known these words.
#
# It is NOT part of the canonical corpus either. Canonical is the 规范 register, and
# folding another register into it would change what the 95% gate measures.

[[case]]
command = "HDEL"
phrases = [
  "把用户的某个属性清掉",
  "drop an attribute off a record",
]

[[case]]
command = "HEXISTS"
phrases = [
  "用户有没有设过头像",
  "does this record have that attribute",
]

[[case]]
command = "HEXPIRE"
phrases = [
  "让某个属性几秒后自己没掉",
  "make one attribute of a record time out",
]

[[case]]
command = "HEXPIREAT"
phrases = [
  "属性到某个点就作废",
  "expire an attribute at a set moment",
]

[[case]]
command = "HEXPIRETIME"
phrases = [
  "这个属性到底哪天没",
  "on what date does this attribute go away",
]

[[case]]
command = "HGET"
phrases = [
  "拿用户的昵称",
  "read one attribute off a record",
]

[[case]]
command = "HGETALL"
phrases = [
  "把整条用户资料读出来",
  "dump the whole record",
]

[[case]]
command = "HGETDEL"
phrases = [
  "取出这个属性并把它清掉",
  "take an attribute and clear it in one go",
]

[[case]]
command = "HGETEX"
phrases = [
  "读属性顺手续一下命",
  "read an attribute and push back when it expires",
]

[[case]]
command = "HINCRBY"
phrases = [
  "给用户的积分加 100",
  "bump a number inside a record",
]

[[case]]
command = "HINCRBYFLOAT"
phrases = [
  "给账户里的金额加 0.5",
  "add a decimal to a number inside a record",
]

[[case]]
command = "HKEYS"
phrases = [
  "这条记录都有哪些属性",
  "what attributes does this record have",
]

[[case]]
command = "HLEN"
phrases = [
  "这条记录有几个属性",
  "how many attributes on this record",
]

[[case]]
command = "HMGET"
phrases = [
  "把用户的几个属性一起取",
  "read a few attributes off a record together",
]

[[case]]
command = "HMSET"
phrases = [
  "一次把用户的好几个属性都写了",
  "write a few attributes on a record at once",
]

[[case]]
command = "HPERSIST"
phrases = [
  "别让这个属性再自动没了",
  "make an attribute stop timing out",
]

[[case]]
command = "HPEXPIRE"
phrases = [
  "属性级别的毫秒超时",
  "sub-second timeout on one attribute",
]

[[case]]
command = "HPEXPIREAT"
phrases = [
  "属性按毫秒时间点作废",
  "expire an attribute at a precise moment",
]

[[case]]
command = "HPEXPIRETIME"
phrases = [
  "属性失效的精确时刻",
  "the exact instant an attribute lapses",
]

[[case]]
command = "HPTTL"
phrases = [
  "属性还剩几毫秒",
  "milliseconds left on an attribute",
]

[[case]]
command = "HRANDFIELD"
phrases = [
  "随机挑一个属性来看",
  "sample an attribute at random",
]

[[case]]
command = "HSCAN"
phrases = [
  "记录太大，想一页一页看属性",
  "walk through a big record without loading it all",
]

[[case]]
command = "HSET"
phrases = [
  "用户资料里改一个属性",
  "update one attribute on a user record",
]

[[case]]
command = "HSETEX"
phrases = [
  "写个属性但让它自己过期",
  "write an attribute that expires on its own",
]

[[case]]
command = "HSETNX"
phrases = [
  "属性没有才补上，不要覆盖",
  "fill in an attribute only if it is missing",
]

[[case]]
command = "HSTRLEN"
phrases = [
  "这个属性的值多大",
  "how big is that one attribute",
]

[[case]]
command = "HTTL"
phrases = [
  "这个属性还能撑多久",
  "how much longer does this attribute last",
]

[[case]]
command = "HVALS"
phrases = [
  "把属性值都拿出来，不管叫什么",
  "give me the values, never mind the names",
]
