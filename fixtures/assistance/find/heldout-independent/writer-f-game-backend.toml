# Held-out phrasing corpus, written by a game backend developer.
# One Chinese and one English phrasing per command, intent only.

[[case]]
command = "BZMPOP"
phrases = [
  "同时盯几个匹配队列 有人就阻塞取走",
  "wait on several ranked queues then pop top or bottom",
]

[[case]]
command = "BZPOPMAX"
phrases = [
  "在匹配队列里等到分最高的玩家再返回",
  "block until the highest scoring entry leaves the queue",
]

[[case]]
command = "BZPOPMIN"
phrases = [
  "挂起等待 优先级最小的那个任务出队",
  "hang there until the lowest ranked item pops off",
]

[[case]]
command = "ZADD"
phrases = [
  "把玩家和他的赛季积分放进排行榜",
  "put a player onto the leaderboard with a score",
]

[[case]]
command = "ZCARD"
phrases = [
  "这个排行榜上总共有多少个玩家",
  "how many entries the whole ranking holds",
]

[[case]]
command = "ZCOUNT"
phrases = [
  "统计积分在某个区间的玩家人数",
  "number of players rated between two values",
]

[[case]]
command = "ZDIFF"
phrases = [
  "昨天上榜但今天不在榜上的那批人",
  "ranked ids in one board and missing from the others",
]

[[case]]
command = "ZDIFFSTORE"
phrases = [
  "两个榜相减的结果落到一个新 key",
  "save the subtracted ranking straight into another key",
]

[[case]]
command = "ZINCRBY"
phrases = [
  "给这个玩家的段位分再加几分",
  "bump one player rating up on the ladder",
]

[[case]]
command = "ZINTER"
phrases = [
  "两个榜都在的玩家 直接返回带分数",
  "players on every board with their points added up",
]

[[case]]
command = "ZINTERCARD"
phrases = [
  "只想知道两个榜重合多少人 名单不要",
  "just the size of the overlap between two ladders",
]

[[case]]
command = "ZINTERSTORE"
phrases = [
  "加权合并共同上榜的玩家 结果存成新榜",
  "write the weighted overlap ranking to a destination key",
]

[[case]]
command = "ZLEXCOUNT"
phrases = [
  "同分的情况下 昵称在某段区间的有几条",
  "count equally scored entries between two names",
]

[[case]]
command = "ZMPOP"
phrases = [
  "从一串队列里挑第一个非空的弹几个出来",
